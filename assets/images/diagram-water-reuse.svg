<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#eef7f6"/>
  <g font-family="Arial, sans-serif">
    <!-- Source -->
    <rect x="20" y="86" width="80" height="48" rx="8" fill="#ffffff" stroke="#0b3833" stroke-opacity="0.15"/>
    <text x="60" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#0b3833">Wastewater</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#54706c">Source</text>

    <!-- Treatment -->
    <rect x="140" y="80" width="80" height="60" rx="8" fill="#2eb39e"/>
    <text x="180" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#04342c">Multi-barrier</text>
    <text x="180" y="118" text-anchor="middle" font-size="8" fill="#04342c">treatment</text>

    <!-- Arrow source -> treatment -->
    <line x1="100" y1="110" x2="138" y2="110" stroke="#0b3833" stroke-width="1.4" marker-end="url(#arrow3)"/>

    <!-- Branches -->
    <line x1="220" y1="100" x2="270" y2="60" stroke="#0b3833" stroke-width="1.2" marker-end="url(#arrow3)"/>
    <line x1="220" y1="110" x2="270" y2="110" stroke="#0b3833" stroke-width="1.2" marker-end="url(#arrow3)"/>
    <line x1="220" y1="120" x2="270" y2="160" stroke="#0b3833" stroke-width="1.2" marker-end="url(#arrow3)"/>

    <rect x="272" y="38" width="112" height="34" rx="7" fill="#ffffff" stroke="#0b3833" stroke-opacity="0.15"/>
    <text x="328" y="59" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b3833">Irrigation / industrial</text>

    <rect x="272" y="93" width="112" height="34" rx="7" fill="#ffffff" stroke="#0b3833" stroke-opacity="0.15"/>
    <text x="328" y="114" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b3833">Groundwater recharge</text>

    <rect x="272" y="148" width="112" height="34" rx="7" fill="#ffffff" stroke="#0b3833" stroke-opacity="0.15"/>
    <text x="328" y="169" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0b3833">Direct potable reuse</text>

    <defs>
      <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#0b3833"/>
      </marker>
    </defs>
  </g>
