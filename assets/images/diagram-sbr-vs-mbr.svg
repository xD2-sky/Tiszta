<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#eef7f6"/>
  <g font-family="Arial, sans-serif">
    <!-- SBR side -->
    <text x="100" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0b3833">SBR</text>
    <rect x="50" y="50" width="100" height="90" rx="10" fill="#ffffff" stroke="#2eb39e" stroke-width="1.6"/>
    <!-- batch cycle arrows inside -->
    <circle cx="100" cy="95" r="28" fill="none" stroke="#2eb39e" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M100 67 L104 74 L96 74 Z" fill="#2eb39e"/>
    <text x="100" y="150" text-anchor="middle" font-size="8.5" fill="#54706c">Single tank,</text>
    <text x="100" y="161" text-anchor="middle" font-size="8.5" fill="#54706c">batch cycle</text>

    <!-- divider -->
    <line x1="200" y1="40" x2="200" y2="170" stroke="#0b3833" stroke-opacity="0.12" stroke-width="1"/>

    <!-- MBR side -->
    <text x="300" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0b3833">MBR</text>
    <rect x="250" y="50" width="100" height="90" rx="10" fill="#ffffff" stroke="#2eb39e" stroke-width="1.6"/>
    <!-- membrane lines -->
    <line x1="270" y1="66" x2="270" y2="124" stroke="#2eb39e" stroke-width="1.4"/>
    <line x1="280" y1="66" x2="280" y2="124" stroke="#2eb39e" stroke-width="1.4"/>
    <line x1="290" y1="66" x2="290" y2="124" stroke="#2eb39e" stroke-width="1.4"/>
    <line x1="300" y1="66" x2="300" y2="124" stroke="#2eb39e" stroke-width="1.4"/>
    <line x1="285" y1="124" x2="330" y2="100" stroke="#0b3833" stroke-width="1.2" marker-end="url(#arrow2)"/>
    <text x="300" y="150" text-anchor="middle" font-size="8.5" fill="#54706c">Biological +</text>
    <text x="300" y="161" text-anchor="middle" font-size="8.5" fill="#54706c">membrane filter</text>
    <defs>
      <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#0b3833"/>
      </marker>
    </defs>
  </g>
</svg>
